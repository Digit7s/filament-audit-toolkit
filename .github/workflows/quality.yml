name: Filament audit toolkit quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout public Laravel core dependency
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: >-
          git -c credential.helper= clone --depth=1 --branch main
          https://github.com/Digit7s/laravel-audit-toolkit.git
          ../../laravel-audit-toolkit
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --no-check-publish
      - run: composer analyse
      - run: composer lint
      - run: composer test
